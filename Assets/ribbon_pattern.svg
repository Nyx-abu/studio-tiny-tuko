<svg width="100%" height="24" viewBox="0 0 1200 24" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="filipino-weave-pattern" width="40" height="24" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="40" y2="1" stroke="#C85A32" stroke-width="1.5" />
      <line x1="0" y1="23" x2="40" y2="23" stroke="#C85A32" stroke-width="1.5" />
      <!-- Top Sawtooth -->
      <polygon points="0,2 5,6 10,2" fill="#E5A93C" />
      <polygon points="10,2 15,6 20,2" fill="#E88D2A" />
      <polygon points="20,2 25,6 30,2" fill="#E5A93C" />
      <polygon points="30,2 35,6 40,2" fill="#E88D2A" />
      <!-- Bottom Sawtooth -->
      <polygon points="0,22 5,18 10,22" fill="#E88D2A" />
      <polygon points="10,22 15,18 20,22" fill="#E5A93C" />
      <polygon points="20,22 25,18 30,22" fill="#E88D2A" />
      <polygon points="30,22 35,18 40,22" fill="#E5A93C" />
      <!-- Center nested diamond (Mata-mata) -->
      <polygon points="20,4 32,12 20,20 8,12" fill="#E88D2A" />
      <polygon points="20,7 28,12 20,17 12,12" fill="#FAF6F0" />
      <polygon points="20,9 24,12 20,15 16,12" fill="#C85A32" />
      <!-- Interlocking diamond edges -->
      <polygon points="0,5 7,12 0,19" fill="#E5A93C" />
      <polygon points="40,5 33,12 40,19" fill="#E5A93C" />
      <circle cx="20" cy="12" r="1.5" fill="#FAF6F0" />
    </pattern>
  </defs>
  <rect width="100%" height="24" fill="url(#filipino-weave-pattern)" />
</svg>